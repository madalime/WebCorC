type: object
description: Verifier
properties:
  id:
    type: string
    description: Stable identifier of the verifier, used to address it.

  label:
    type: string
    description: Human-readable name of the verifier.

  enabled:
    type: boolean
    description: Whether the verifier is selected to run.

  disableable:
    type: boolean
    description: >-
      Whether the user is allowed to disable this verifier. `false` locks the
      enabled toggle in the on position — the verifier is mandatory and will
      always run. Defaults to `true` (freely toggleable) when omitted.

  settings:
    type: array
    description: Configurable settings of the verifier.
    items:
      $ref: './setting.yml'

  variables:
    type: array
    description: >-
      Domain variables the verifier operates on. Passed through to the verifier
      backend; the frontend does not interpret them beyond rendering.
    items:
      $ref: './variable.yml'

required:
  - id
  - label
  - enabled