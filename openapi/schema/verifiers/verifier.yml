type: object
description: Verifier
properties:
  id:
    type: string
    description: Stable identifier of the verifier, used to address it.

  label:
    type: string
    description: Human-readable name of the verifier.

  enabled:
    type: boolean
    description: Whether the verifier is selected to run.

  toggleable:
    type: boolean
    description: >-
      Whether the user can move the enabled toggle. Defaults to `true` (freely
      toggleable) when omitted. `false` locks the toggle at whatever `enabled`
      is declared as — either a mandatory-on verifier (`enabled: true`) or a
      forced-off one (`enabled: false`). A locked verifier's `enabled` is
      catalog-owned: a saved override contradicting it is ignored on load.

  settings:
    type: array
    description: Configurable settings of the verifier.
    items:
      $ref: './setting.yml'

  variables:
    type: array
    description: >-
      Domain variables the verifier operates on. Passed through to the verifier
      backend; the frontend does not interpret them beyond rendering.
    items:
      $ref: './variable.yml'

  allowFunctionalVariables:
    type: boolean
    description: >-
      Whether the functional variables — the statement's own program variables —
      may be referenced inside this verifier's non-functional conditions,
      alongside its own `variables`. Only meaningful for a verifier that declares
      `variables` at all; defaults to `false` (not allowed) when omitted, so a
      catalog must opt in explicitly.

required:
  - id
  - label
  - enabled