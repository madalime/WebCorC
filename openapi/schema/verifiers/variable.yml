type: object
description: >-
  A domain variable a verifier operates on. `type` is a free-form string that
  names the variable's type (e.g. `int`, `boolean`, a class name) — passed
  through to the verifier backend, not interpreted by the frontend.
properties:
  id:
    type: string
    description: Stable identifier of the variable, used to address it.

  type:
    type: string
    description: Type name of the variable (e.g. `int`, `boolean`, a class name).

  name:
    type: string
    description: Human-readable name of the variable.

  description:
    type: string
    description: Optional longer description of what the variable represents.

required:
  - id
  - type
  - name