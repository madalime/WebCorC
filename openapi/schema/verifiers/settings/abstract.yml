type: object
description: AbstractVerifierSetting
properties:
  id:
    type: string
    description: Stable key of the setting, used to address it when persisting changes.

  label:
    type: string
    description: Human-readable label rendered next to the input.

  description:
    type: string
    description: Optional longer description of what the setting controls.

  input:
    type: string
    description: >-
      Current, persisted value of the setting. Seeded from `default` on load. Always a
      string — numeric settings store their value as a canonical `.`-separated decimal
      string.

  required:
    type: boolean
    description: >-
      Whether the setting must be filled in. When `true`, `default` must be provided.

  default:
    type: string
    description: >-
      Value used to preinitialize the input. Mandatory when `required` is `true`,
      optional otherwise.

required:
  - id
  - label