description: VerifierSelectSetting
allOf:
  - $ref: './abstract.yml'
  - type: object
    properties:
      type:
        type: string
        enum:
          - select

      options:
        type: array
        description: Predefined options rendered in the dropdown.
        items:
          type: object
          properties:
            id:
              type: string
              description: Stable id of the option, persisted when the option is chosen.

            label:
              type: string
              description: Human-readable label rendered for the option.

          required:
            - id
            - label

    required:
      - type
      - options