type: object
description: >-
  The root of the program a Verifier receives to start a job: the same
  structural, static-analysis-friendly representation the Functional
  Verifier already works from — never generated or compiled code. A
  narrowed view of WebCorC's own internal formula shape (see ADR
  0001-verifiers-are-external-services), carrying only what a Verifier
  needs. `preCondition`/`postCondition` already carry this Verifier's own
  Verifier Condition for the root, in place of a sparse per-Verifier map,
  and are both absent where the user has not written one.
properties:
  name:
    type: string

  className:
    type: string

  methodName:
    type: string

  javaVariables:
    type: array
    description: The method's own Java variables, by name.
    items:
      type: string

  globalConditions:
    type: array
    description: >-
      Conditions declared once for the whole program, outside any single
      statement. Structural — the same for every Verifier, never swapped.
    items:
      $ref: '../../cbc/condition.yml'

  preCondition:
    $ref: '../../cbc/condition.yml'

  postCondition:
    $ref: '../../cbc/condition.yml'

  statement:
    $ref: './statement.yml'

required:
  - name
  - className
  - methodName
  - javaVariables
  - globalConditions
  - statement
