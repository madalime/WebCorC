description: >-
  A repetition (loop) statement. `guard` is the program's own loop
  condition — the expression of its `while (…)` — and so the same for every
  Verifier. The loop's invariant and variant are functional specification
  and are not sent.
allOf:
  - $ref: './abstract.yml'
  - type: object
    properties:
      guard:
        $ref: '../condition.yml'

      loopStatement:
        $ref: '../statement.yml'

    required:
      - guard
      - loopStatement
