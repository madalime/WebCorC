type: object
description: CBCFormula
properties:
  type: 
    type: string
    enum:
      - CBCFormula

  name:
    type: string
  
  proven:
    type: boolean

  comment:
    type: string 
  
  compostionTechnique:
    type: string
    enum:
      - CONTRACT_OVERRIDING

  className:
    type: string 

  methodeName: 
    type: string 

  javaVariables:
    type: array
    items:  
      type: string

  globalConditions:
    type: array
    items: 
      $ref: './condition.yml'

  preCondition:
    type: string

  postCondition:
    type: string

  verifiers:
    description: >
      The program root's per-Verifier conditions and results: the conditions are the
      ones flattened into the formula's preCondition/postCondition on export, and the
      results are the last run's, carrying func and every catalog Verifier exactly like
      a statement's own map. A non-functional Verifier's proven/status here are what its
      done message said about the whole run.
    allOf:
      - $ref: './verifiers.yml'

  statement:
    $ref: './statement.yml'

required:
  - type
  - name 
  - proven
  - comment
  - compostionTechnique
  - className
  - methodeName
  - javaVariables
  - globalConditions
  - preCondition
  - postCondition
  - statement