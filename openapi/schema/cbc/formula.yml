type: object
description: CBCFormula
properties:
  type: 
    type: string
    enum:
      - CBCFormula

  name:
    type: string
  
  proven:
    type: boolean

  comment:
    type: string 
  
  compostionTechnique:
    type: string
    enum:
      - CONTRACT_OVERRIDING

  className:
    type: string 

  methodeName: 
    type: string 

  javaVariables:
    type: array
    items:  
      type: string

  globalConditions:
    type: array
    items: 
      $ref: './condition.yml'

  preCondition:
    type: string

  postCondition:
    type: string

  verifiers:
    description: >
      Per-Verifier conditions and results of the root statement, which is flattened
      into the formula's preCondition/postCondition on export.
    allOf:
      - $ref: './verifiers.yml'

  statement:
    $ref: './statement.yml'

required:
  - type
  - name 
  - proven
  - comment
  - compostionTechnique
  - className
  - methodeName
  - javaVariables
  - globalConditions
  - preCondition
  - postCondition
  - statement