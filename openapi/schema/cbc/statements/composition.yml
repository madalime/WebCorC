description: Compostion Statement 
allOf:
 - $ref: './abstract.yml'
 - type: object
   properties:
      intermediateCondition:
        $ref: '../condition.yml'

      verifierIntermediateConditions:
        type: object
        description: >
          Verifier-specific intermediate conditions, keyed by verifier id.
          Sparse like verifierConditions; the primary (functional) verifier's
          intermediate condition is the statement's own intermediateCondition.
        additionalProperties:
          $ref: '../condition.yml'

      leftStatement:
        $ref: '../statement.yml'

      rightStatement:
        $ref: '../statement.yml'

required:
  - statementType
  - intermediateCondition
  - leftStatement
  - rightStatement