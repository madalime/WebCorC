type: object
description: >
  Per-Verifier conditions and results, keyed by Verifier id. Sparse — only Verifiers
  with at least one non-empty condition or a reported result have an entry; the
  Functional Verifier's conditions are the owning statement's own
  preCondition/postCondition/intermediateCondition, and it never appears here.
  An entry the user authored carries the conditions; one a Verifier's result created
  (a Verifier checks every statement, whether or not a condition was written for it)
  carries only proven/status, with no conditions at all.
additionalProperties:
  type: object
  properties:
    preCondition:
      $ref: './condition.yml'

    postCondition:
      $ref: './condition.yml'

    intermediateCondition:
      description: >
        Only present on composition statements, and only when non-empty.
      allOf:
        - $ref: './condition.yml'

    proven:
      description: >
        Whether this Verifier's check of this statement passed. Absent until a run
        has reached the Verifier phase for the first time; from then on always
        present, reset to false for every catalog Verifier at the start of every
        such run, and set true only once this Verifier has itself proven this
        statement in that run.
      type: boolean

    status:
      description: >
        Either this Verifier's own opaque status text for this statement (see the
        Verifier Status domain concept), a fixed text saying this Verifier did not
        run because it was disabled for the run, or absent — cleared at the start
        of a run for a Verifier that is enabled and about to run, and until then
        absent entirely, the same as proven.
      type: string
