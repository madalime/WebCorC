type: object
description: >
  Per-Verifier conditions and results, keyed by Verifier id. Sparse — only Verifiers
  with at least one non-empty condition or a reported result have an entry; the
  Functional Verifier's conditions are the owning statement's own
  preCondition/postCondition/intermediateCondition, and it never appears here.
additionalProperties:
  type: object
  properties:
    preCondition:
      $ref: './condition.yml'

    postCondition:
      $ref: './condition.yml'

    intermediateCondition:
      description: >
        Only present on composition statements, and only when non-empty.
      allOf:
        - $ref: './condition.yml'

    proven:
      description: >
        Whether this Verifier's check of this statement passed. Absent until this
        Verifier has reported a result for this statement.
      type: boolean

    status:
      description: >
        Opaque status text this Verifier set for this statement (see the Verifier
        Status domain concept). Absent until this Verifier has reported one.
      type: string

  required:
    - preCondition
    - postCondition
