type: object
description: >
  Verifier-specific conditions, keyed by verifier id. Sparse — only verifiers with
  at least one non-empty condition have an entry; the primary (functional)
  verifier's conditions are the owning statement's own
  preCondition/postCondition/intermediateCondition.
additionalProperties:
  type: object
  properties:
    preCondition:
      $ref: './condition.yml'

    postCondition:
      $ref: './condition.yml'

    intermediateCondition:
      description: >
        Only present on composition statements, and only when non-empty.
      allOf:
        - $ref: './condition.yml'

  required:
    - preCondition
    - postCondition
